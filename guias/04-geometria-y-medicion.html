<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161B">
<title>Punto Ciego · Guía interactiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   PUNTO CIEGO · plantilla base v3.0
   Sistema visual BYMCYL — tinta / oro / acento por materia
   No editar esta hoja al crear una guía nueva.
   ═══════════════════════════════════════════════════════════════ */

:root{
  --tinta:#14161B; --tinta-2:#232733; --tinta-3:#3A404F; --tinta-4:#6B7385;
  --papel:#F6F3EC; --papel-2:#EDE8DD;
  --oro:#C9A227; --oro-claro:#FAF3DC; --oro-texto:#8A6D12;
  --violeta:#6C4AB6; --violeta-claro:#EFEAFA;
  --acento:var(--violeta); --acento-claro:var(--violeta-claro);
  --acierto:#2F6F52; --acierto-claro:#E6F0EA;
  --trampa:#A8382F; --trampa-claro:#F7E9E7;
  --linea:#D8D2C4;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --texto:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --dato:'Space Mono','SFMono-Regular',Consolas,monospace;
  --r:10px; --barra:78px; --cabeza:52px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--texto);background:var(--papel);color:var(--tinta);
  line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--barra) + env(safe-area-inset-bottom));
}

/* ── progreso ─────────────────────────────────────────────────── */
#progreso{position:fixed;top:0;left:0;right:0;height:3px;background:var(--papel-2);z-index:60}
#progreso i{display:block;height:100%;width:0;background:var(--oro);transition:width .25s ease}

/* ── cabecera de sección ──────────────────────────────────────── */
#cabeza{
  position:sticky;top:3px;z-index:45;background:rgba(246,243,236,.97);
  border-bottom:1px solid var(--linea);backdrop-filter:blur(8px);
}
.cabeza-int{
  max-width:640px;margin:0 auto;height:var(--cabeza);
  display:flex;align-items:center;gap:12px;padding:0 14px;
}
.cabeza-tit{
  flex:1;min-width:0;font-family:var(--dato);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tinta-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cabeza-tit b{color:var(--tinta);display:block;font-size:12px;letter-spacing:.06em}
.icono{
  background:none;border:1px solid var(--linea);border-radius:8px;
  font:inherit;font-size:12px;font-weight:600;padding:7px 11px;
  color:var(--tinta);cursor:pointer;min-height:36px;white-space:nowrap;
}
.icono:hover{background:var(--papel-2)}
.icono:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.icono[aria-pressed="true"]{background:var(--oro-claro);border-color:var(--oro)}
.crono{
  font-family:var(--dato);font-size:13px;font-weight:700;flex-shrink:0;
  border:1px solid var(--linea);border-radius:8px;padding:6px 10px;color:var(--tinta);
}
.crono--fin{color:var(--trampa);border-color:var(--trampa)}

.envoltura{max-width:640px;margin:0 auto;padding:24px 18px}

/* ── tipografía ───────────────────────────────────────────────── */
.eyebrow{font-family:var(--dato);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-3)}
h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;letter-spacing:-.015em;margin:10px 0 8px}
h2{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.25;margin:0 0 12px}
h3{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 10px}
p{margin:0 0 12px} p:last-child{margin-bottom:0}
.ic{width:13px;height:13px;vertical-align:-2px;margin-right:5px}

/* ── marca ────────────────────────────────────────────────────── */
.marca-grande{
  font-family:var(--dato);font-size:13px;font-weight:700;
  letter-spacing:.26em;text-transform:uppercase;color:var(--oro-texto);
}
.tagline{font-family:var(--display);font-size:16px;color:var(--tinta-3);margin:6px 0 16px}
.edicion{
  font-family:var(--dato);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta-3);margin:-10px 0 16px;
}
.edicion b{color:var(--tinta)}
.sello{font-size:12.5px;color:var(--tinta-4);margin-top:26px;padding-top:14px;border-top:1px solid var(--linea)}
.sello b{color:var(--tinta-3)}
.fila-enlaces{margin-top:16px}

/* ── tarjetas ─────────────────────────────────────────────────── */
.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:var(--r);padding:20px 18px;margin-bottom:16px}
.tarjeta--concepto{border-left:3px solid var(--acento)}
.tarjeta--cierre{border-left:3px solid var(--oro)}
.tarjeta--alerta{border-left:3px solid var(--trampa)}
.tarjeta--bien{border-left:3px solid var(--acierto)}
.clave{margin-top:16px;padding:12px 14px;background:var(--acento-claro);border-radius:8px;font-size:15px}
.clave b{display:block;font-family:var(--dato);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acento);margin-bottom:4px}

/* ── portada ──────────────────────────────────────────────────── */
.subtitulo{font-size:17px;color:var(--tinta-3);margin-bottom:18px}
.ficha{display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);padding:14px 0;margin-bottom:22px}
.ficha div{flex:1 1 30%}
.ficha span{display:block;font-family:var(--dato);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3)}
.ficha b{font-size:14px;font-weight:600}

/* ── índice de secciones ──────────────────────────────────────── */
.seccion-btn{
  display:block;width:100%;text-align:left;background:#fff;
  border:1px solid var(--linea);border-radius:var(--r);
  padding:15px 16px;margin-bottom:10px;font:inherit;color:var(--tinta);cursor:pointer;
}
.seccion-btn:hover{border-color:var(--tinta-3)}
.seccion-btn:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.seccion-btn[data-estado="curso"]{border-left:3px solid var(--oro)}
.seccion-btn[data-estado="hecha"]{border-left:3px solid var(--acierto)}
.sec-fila{display:flex;align-items:baseline;gap:10px}
.sec-num{font-family:var(--dato);font-size:11px;font-weight:700;color:var(--tinta-4);flex-shrink:0}
.sec-tit{font-weight:600;font-size:16px;flex:1}
.sec-marca{font-family:var(--dato);font-size:11px;font-weight:700;flex-shrink:0}
.sec-desc{font-size:14px;color:var(--tinta-3);margin-top:5px}
.sec-riel{height:4px;background:var(--papel-2);border-radius:2px;margin-top:11px;overflow:hidden}
.sec-riel i{display:block;height:100%;background:var(--oro)}

/* ── pregunta ─────────────────────────────────────────────────── */
.pregunta-cab{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.numero{font-family:var(--dato);font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--oro-texto);flex:1}
.enunciado{font-size:17px;font-weight:500;margin:8px 0 14px;line-height:1.45}

.datos{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:14.5px}
.datos th,.datos td{border:1px solid var(--linea);padding:8px 10px;text-align:left}
.datos th{background:var(--papel-2);font-family:var(--dato);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.datos td{font-family:var(--dato)}

/* ── gráficas SVG ─────────────────────────────────────────────── */
.grafico{margin:0 0 16px;border:1px solid var(--linea);border-radius:8px;background:#fff;padding:10px 8px 4px}
.grafico svg{display:block;width:100%;height:auto}
.grafico figcaption{font-family:var(--dato);font-size:11.5px;color:var(--tinta-3);padding:6px 6px 4px}
.graficos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 16px}
.graficos .grafico{margin:0}
.gr-eje{font-family:var(--dato);font-size:10px;fill:var(--tinta-4)}
.gr-cat{font-family:var(--dato);font-size:11px;fill:var(--tinta-3)}
.gr-val{font-family:var(--dato);font-size:12px;font-weight:700;fill:var(--tinta)}
.gr-tit{font-family:var(--dato);font-size:11px;letter-spacing:.08em;text-transform:uppercase;fill:var(--tinta-3)}

.confianza{margin-bottom:14px}
.confianza p{font-size:13px;color:var(--tinta-3);margin-bottom:7px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  font:inherit;font-size:13px;padding:8px 13px;border-radius:20px;
  border:1px solid var(--linea);background:#fff;color:var(--tinta-3);
  cursor:pointer;min-height:38px;
}
.chip:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--papel);font-weight:600}
.chip:disabled{cursor:default}

/* escala de seguridad: verde / amarillo / rojo (el orden importa: va después
   de la regla general de .chip para ganarle en la cascada) */
.chip--conf{font-weight:600;border-width:1.5px;padding:9px 15px;min-height:42px}
.chip--conf .punto{
  display:inline-block;width:9px;height:9px;border-radius:50%;
  background:currentColor;margin-right:7px;vertical-align:1px;
}
.chip--seguro{color:var(--acierto);border-color:var(--acierto)}
.chip--seguro[aria-pressed="true"]{background:var(--acierto);border-color:var(--acierto);color:#fff}
.chip--medio{color:var(--oro-texto);border-color:var(--oro-texto)}
.chip--medio[aria-pressed="true"]{background:var(--oro);border-color:var(--oro);color:var(--tinta)}
.chip--azar{color:var(--trampa);border-color:var(--trampa)}
.chip--azar[aria-pressed="true"]{background:var(--trampa);border-color:var(--trampa);color:#fff}
.chip--conf[aria-pressed="true"] .punto{background:currentColor;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.confianza p.exige{color:var(--tinta);font-weight:600;font-size:14px}
.confianza .marca-elegida{font-size:13px;color:var(--tinta-3);margin-bottom:7px}

.opciones{list-style:none;display:flex;flex-direction:column;gap:9px}
.opcion{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:#fff;border:1px solid var(--linea);border-radius:8px;
  padding:13px 14px;font:inherit;font-size:15.5px;color:var(--tinta);
  cursor:pointer;transition:border-color .12s,background .12s;min-height:48px;
}
.opcion:hover:not(:disabled){border-color:var(--tinta-3)}
.opcion:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.opcion:disabled{cursor:default;opacity:.5}
.opcion .letra{font-family:var(--dato);font-size:12px;font-weight:700;color:var(--tinta-3);flex-shrink:0;padding-top:2px;min-width:16px}
.opcion[data-estado="acierto"]{border-color:var(--acierto);background:var(--acierto-claro);opacity:1}
.opcion[data-estado="acierto"] .letra{color:var(--acierto)}
.opcion[data-estado="fallo"]{border-color:var(--trampa);background:var(--trampa-claro);opacity:1}
.opcion[data-estado="fallo"] .letra{color:var(--trampa)}
.opcion[data-estado="descartada"]{border-color:var(--linea);background:var(--papel-2);opacity:.45;text-decoration:line-through}
.opcion[data-estado="elegida"]{border-color:var(--tinta);background:var(--papel-2);opacity:1}

.respuesta{margin-top:16px;border-radius:8px;padding:14px;font-size:15px}
.respuesta[data-tipo="acierto"]{background:var(--acierto-claro);border-left:3px solid var(--acierto)}
.respuesta[data-tipo="fallo"]{background:var(--trampa-claro);border-left:3px solid var(--trampa)}
.respuesta[data-tipo="nudge"]{background:var(--oro-claro);border-left:3px solid var(--oro)}
.respuesta .titulo{font-family:var(--dato);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:6px;display:block}
.respuesta[data-tipo="acierto"] .titulo{color:var(--acierto)}
.respuesta[data-tipo="fallo"] .titulo{color:var(--trampa)}
.respuesta[data-tipo="nudge"] .titulo{color:var(--oro-texto)}
.respuesta .porque{margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,.09)}
.aviso-confianza{
  margin-top:12px;padding:10px 12px;background:rgba(0,0,0,.045);
  border-radius:6px;font-size:14px;
}
.video{display:inline-block;margin-top:10px;font-size:14px;color:var(--acento);text-decoration:underline;text-underline-offset:3px}

.pista{margin-top:14px;font-size:14px;color:var(--tinta-3);background:var(--papel-2);border-radius:8px;padding:11px 13px}
.enlace-pista{background:none;border:0;padding:0;margin-top:14px;cursor:pointer;font:inherit;font-size:14px;color:var(--acento);text-decoration:underline;text-underline-offset:3px}
.enlace-pista:focus-visible{outline:2px solid var(--acento);outline-offset:3px}

.campo{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--linea);border-radius:8px;background:#fff;font-family:var(--dato)}
.campo:focus{outline:2px solid var(--acento);outline-offset:1px;border-color:var(--acento)}
.cod{font-size:12.5px;line-height:1.5;resize:vertical;word-break:break-all}

/* ── barra inferior ───────────────────────────────────────────── */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(246,243,236,.97);border-top:1px solid var(--linea);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);
}
.barra-int{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.contador{font-family:var(--dato);font-size:11px;line-height:1.3;color:var(--tinta-3);flex:1;min-width:0}
.contador b{display:block;color:var(--tinta);font-size:13px}
.btn{
  font:inherit;font-weight:600;font-size:15px;padding:13px 20px;border-radius:8px;
  border:1px solid var(--tinta);background:var(--tinta);color:var(--papel);
  cursor:pointer;min-height:48px;transition:opacity .12s;
}
.btn:hover:not(:disabled){opacity:.86}
.btn:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn--fantasma{background:transparent;color:var(--tinta);border-color:var(--linea)}
.btn--ancho{width:100%}
.btn--oro{background:var(--oro);border-color:var(--oro);color:var(--tinta)}
.btn--chico{padding:9px 14px;font-size:13.5px;min-height:40px}

/* ── informe ──────────────────────────────────────────────────── */
.marcador{display:flex;border:1px solid var(--linea);border-radius:var(--r);overflow:hidden;background:#fff;margin-bottom:16px}
.marcador div{flex:1;padding:16px 8px;text-align:center;border-right:1px solid var(--linea)}
.marcador div:last-child{border-right:0}
.marcador .cifra{font-family:var(--dato);font-size:25px;font-weight:700;display:block;line-height:1.1}
.marcador .rotulo{font-family:var(--dato);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-3);display:block;margin-top:4px}

.matriz{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.celda{border:1px solid var(--linea);border-radius:8px;padding:13px 12px}
.celda .n{font-family:var(--dato);font-size:22px;font-weight:700;line-height:1}
.celda .t{font-weight:600;font-size:14px;margin-top:5px}
.celda .d{font-size:12.5px;color:var(--tinta-3);margin-top:3px;line-height:1.4}
.celda--ciego{border-color:var(--trampa);background:var(--trampa-claro)}
.celda--ciego .n{color:var(--trampa)}
.celda--dominio{border-color:var(--acierto);background:var(--acierto-claro)}
.celda--dominio .n{color:var(--acierto)}
.celda--fragil{border-color:var(--oro);background:var(--oro-claro)}
.celda--fragil .n{color:var(--oro-texto)}

.mapa{list-style:none;margin-top:4px}
.mapa li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--linea);font-size:15px}
.mapa li:last-child{border-bottom:0}
.mapa .estado{font-family:var(--dato);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;flex-shrink:0;font-weight:700}
.estado--claro{color:var(--acierto)}
.estado--ciego{color:var(--trampa)}
.estado--medio{color:var(--oro-texto)}

.trampas{list-style:none;margin-top:4px}
.trampas li{padding:9px 0;border-bottom:1px solid var(--linea)}
.trampas li:last-child{border-bottom:0}
.trampas .fila{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin-bottom:6px}
.trampas .veces{font-family:var(--dato);font-size:12px;font-weight:700;color:var(--trampa);flex-shrink:0}
.trampas .riel{height:5px;background:var(--papel-2);border-radius:3px;overflow:hidden}
.trampas .riel i{display:block;height:100%;background:var(--trampa)}

.reco{list-style:none}
.reco li{padding:10px 0 10px 20px;border-bottom:1px solid var(--linea);font-size:15px;position:relative}
.reco li:last-child{border-bottom:0}
.reco li::before{content:'→';position:absolute;left:0;color:var(--oro);font-weight:700}

/* ── revisión ─────────────────────────────────────────────────── */
.rev-item{border:1px solid var(--linea);border-radius:var(--r);background:#fff;margin-bottom:10px;overflow:hidden}
.rev-cab{
  display:flex;gap:10px;align-items:center;width:100%;text-align:left;
  background:none;border:0;padding:13px 14px;font:inherit;cursor:pointer;color:var(--tinta);
}
.rev-cab:focus-visible{outline:2px solid var(--acento);outline-offset:-2px}
.rev-marca{font-family:var(--dato);font-size:11px;font-weight:700;flex-shrink:0;width:26px}
.rev-marca[data-r="ok"]{color:var(--acierto)}
.rev-marca[data-r="mal"]{color:var(--trampa)}
.rev-marca[data-r="no"]{color:var(--tinta-4)}
.rev-txt{flex:1;font-size:14.5px;line-height:1.4}
.rev-cuerpo{padding:0 14px 14px;border-top:1px solid var(--linea);padding-top:13px;font-size:14.5px}
.rev-cuerpo dl{margin-top:8px}
.rev-cuerpo dt{font-family:var(--dato);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-3);margin-top:10px}
.rev-cuerpo dd{margin-top:3px}

.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}

.candado{background:var(--tinta);color:var(--papel);border-radius:var(--r);padding:24px 20px;text-align:center}
.candado h2{color:var(--papel);font-size:20px}
.candado p{color:#C7C2B6;font-size:15px}
.candado .precio{font-family:var(--dato);font-size:24px;font-weight:700;color:var(--oro);display:block;margin:14px 0 6px}

.acciones{display:flex;flex-direction:column;gap:10px;margin-top:18px}
#acciones-nota{min-height:18px;font-size:13px;color:var(--tinta-3);text-align:center}
.vacio{text-align:center;color:var(--tinta-3);padding:24px 10px;font-size:15px}

@media (max-width:430px){
  .graficos{grid-template-columns:1fr}
  .marcador .cifra{font-size:21px}
}
@media print{
  body{background:#fff;padding:0;font-size:11pt}
  #progreso,#cabeza,.barra,.acciones,.filtros,.no-imprimir{display:none!important}
  .tarjeta,.marcador,.celda,.grafico{border:1px solid #999;break-inside:avoid}
  .rev-cuerpo{display:block!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="progreso" aria-hidden="true"><i></i></div>
<header id="cabeza" hidden></header>
<main class="envoltura" id="lienzo"></main>
<div class="barra" id="barra" hidden></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   ▼▼▼  ÚNICA ZONA A EDITAR PARA CREAR UNA GUÍA NUEVA  ▼▼▼

   REFERENCIA RÁPIDA DE CAMPOS (v3.0)

   meta:
     paleta        'violeta' | 'verde' | 'azul' | 'terracota' | 'vino'
                   (sugerido: matemáticas=violeta, ciencias=verde,
                    sociales=azul, lectura=terracota, inglés=vino)

   ajustes:

function fechaCorta(ms){
  const d = new Date(ms), hoy = new Date();
  const mismoDia = d.toDateString() === hoy.toDateString();
  const hora = d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});
  return mismoDia ? 'hoy ' + hora : d.toLocaleDateString('es-CO',{day:'numeric',month:'short'}) + ' ' + hora;
}
function fmtCrono(ms){
  const s = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(s/60), r = s % 60;
  return m + ':' + String(r).padStart(2,'0');
}

const LETRAS = 'ABCDE';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Normaliza respuestas abiertas: acepta $ , espacios, %, puntos de miles
// y coma o punto decimal al estilo es-CO. «31.500», «31500» y «31 500»
// terminan siendo la misma cifra; «3,5» y «3.5» también.
function norm(t){
  t = String(t).toLowerCase().trim().normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'').replace(/[$\s%]/g,'');
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t))      t = t.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g,'');
  else if(/^\d+,\d+$/.test(t))                  t = t.replace(',','.');
  if(/^\d+(\.\d+)?$/.test(t)) return 'n' + parseFloat(t);
  return t.replace(/[.,]/g,'');
}

function barajar(a){

}

/* ── gráficas SVG ─────────────────────────────────────────────── */
function nEje(v){ v = Math.round(v * 10) / 10; return String(v).replace('.',','); }

function svgBarras(g){
  const W = g.ancho || 560, H = g.alto || 300;
  const padL = 46, padR = 14, padT = g.titulo ? 32 : 18, padB = 34;
  const v = g.valores, n = v.length;
  const ini = (g.ejeInicio != null) ? g.ejeInicio : 0;
  let fin = (g.ejeFin != null) ? g.ejeFin : Math.max.apply(null, v) * 1.12;
  if(fin <= ini) fin = ini + 1;
  const pw = W - padL - padR, ph = H - padT - padB;
  const X = i => padL + pw * (i + .5) / n;
  const bw = Math.min(64, pw / n * .56);
  const Y = val => padT + ph * (1 - (val - ini) / (fin - ini));
  let s = '';
  for(let t = 0; t <= 4; t++){
    const val = ini + (fin - ini) * t / 4, yy = Y(val).toFixed(1);
    s += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="var(--linea)"/>';
    s += '<text x="'+(padL-7)+'" y="'+(+yy+3.5)+'" text-anchor="end" class="gr-eje">'+nEje(val)+'</text>';
  }
  v.forEach(function(val, i){
    const bx = (X(i) - bw/2).toFixed(1), by = Y(val);
    s += '<rect x="'+bx+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(padT+ph-by).toFixed(1)+'" rx="3" fill="var(--tinta-2)"/>';
    s += '<text x="'+X(i)+'" y="'+(by-7).toFixed(1)+'" text-anchor="middle" class="gr-val">'+nEje(val)+(g.unidad||'')+'</text>';
    s += '<text x="'+X(i)+'" y="'+(H-padB+16)+'" text-anchor="middle" class="gr-cat">'+esc(String(g.etiquetas[i]))+'</text>';
  });
  s += '<line x1="'+padL+'" y1="'+(padT+ph)+'" x2="'+(W-padR)+'" y2="'+(padT+ph)+'" stroke="var(--tinta-3)" stroke-width="1.5"/>';
  if(ini > 0) s += '<path d="M '+padL+' '+(padT+ph+3)+' l 4 4 l -8 4 l 4 4" fill="none" stroke="var(--tinta-3)" stroke-width="1.5"/>';
  const tt = g.titulo ? '<text x="'+padL+'" y="17" class="gr-tit">'+esc(g.titulo)+'</text>' : '';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(g.alt||g.titulo||'Gráfico de barras')+'">'+tt+s+'</svg>';
}

function svgLinea(g){
  const W = g.ancho || 560, H = g.alto || 300;
  const padL = 46, padR = 16, padT = g.titulo ? 32 : 18, padB = 34;
  const v = g.valores, n = v.length;
  const mn = Math.min.apply(null, v), mx = Math.max.apply(null, v), rg = (mx - mn) || 1;
  const ini = (g.ejeInicio != null) ? g.ejeInicio : Math.max(0, mn - rg * .18);
  const fin = (g.ejeFin != null) ? g.ejeFin : mx + rg * .15;
  const pw = W - padL - padR, ph = H - padT - padB;
  const X = i => padL + pw * (n === 1 ? .5 : i / (n - 1));
  const Y = val => padT + ph * (1 - (val - ini) / (fin - ini));
  let s = '';
  for(let t = 0; t <= 3; t++){
    const val = fin - (fin - ini) * t / 3, yy = Y(val).toFixed(1);
    s += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="var(--linea)"/>';
    s += '<text x="'+(padL-7)+'" y="'+(+yy+3.5)+'" text-anchor="end" class="gr-eje">'+nEje(val)+'</text>';
  }
  const pts = v.map(function(val, i){ return X(i).toFixed(1) + ',' + Y(val).toFixed(1); }).join(' ');
  s += '<polyline points="'+pts+'" fill="none" stroke="var(--acento)" stroke-width="2.5" stroke-linejoin="round"/>';
  const iMax = v.indexOf(mx);
  v.forEach(function(val, i){
    s += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(val).toFixed(1)+'" r="3.4" fill="var(--acento)"/>';
    if(i === 0 || i === n - 1 || i === iMax)
      s += '<text x="'+X(i).toFixed(1)+'" y="'+(Y(val)-9).toFixed(1)+'" text-anchor="middle" class="gr-val">'+nEje(val)+(g.unidad||'')+'</text>';
    s += '<text x="'+X(i).toFixed(1)+'" y="'+(H-padB+16)+'" text-anchor="middle" class="gr-cat">'+esc(String(g.etiquetas[i]))+'</text>';
  });
  s += '<line x1="'+padL+'" y1="'+(padT+ph)+'" x2="'+(W-padR)+'" y2="'+(padT+ph)+'" stroke="var(--tinta-3)" stroke-width="1.5"/>';
  const tt = g.titulo ? '<text x="'+padL+'" y="17" class="gr-tit">'+esc(g.titulo)+'</text>' : '';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(g.alt||g.titulo||'Gráfica de línea')+'">'+tt+s+'</svg>';
}

function svgCircular(g){
  const W = g.ancho || 460, H = g.alto || 250;
  const cx = 118, cy = H / 2, R = 88, r = 48;
  const segs = g.segmentos.map(function(o){ return {e:o.etiqueta, v:o.valor, inc:false}; });
  const suma = segs.reduce(function(a, o){ return a + (o.v || 0); }, 0);
  segs.forEach(function(o){ if(o.v == null){ o.v = Math.max(0, 100 - suma); o.inc = true; } });
  const cols = ['var(--acento)','var(--oro)','var(--tinta-3)','#8E3B5C','var(--tinta-2)'];
  let a0 = -Math.PI / 2, s = '';
  segs.forEach(function(o, i){
    const a1 = a0 + o.v / 100 * 2 * Math.PI;
    const grande = (a1 - a0) > Math.PI ? 1 : 0;
    const p = 'M ' + (cx + R * Math.cos(a0)).toFixed(2) + ' ' + (cy + R * Math.sin(a0)).toFixed(2) +
      ' A ' + R + ' ' + R + ' 0 ' + grande + ' 1 ' + (cx + R * Math.cos(a1)).toFixed(2) + ' ' + (cy + R * Math.sin(a1)).toFixed(2) +
      ' L ' + (cx + r * Math.cos(a1)).toFixed(2) + ' ' + (cy + r * Math.sin(a1)).toFixed(2) +
      ' A ' + r + ' ' + r + ' 0 ' + grande + ' 0 ' + (cx + r * Math.cos(a0)).toFixed(2) + ' ' + (cy + r * Math.sin(a0)).toFixed(2) + ' Z';
    s += o.inc
      ? '<path d="'+p+'" fill="var(--papel-2)" stroke="var(--tinta-4)" stroke-width="1.5" stroke-dasharray="4 3"/>'
      : '<path d="'+p+'" fill="'+cols[i % cols.length]+'" stroke="#fff" stroke-width="1.5"/>';
    const mid = (a0 + a1) / 2;
    const lx = (cx + (R + r) / 2 * Math.cos(mid)).toFixed(1);
    const ly = (cy + (R + r) / 2 * Math.sin(mid) + 4).toFixed(1);
    s += '<text x="'+lx+'" y="'+ly+'" text-anchor="middle" class="gr-val" style="fill:'+(o.inc?'var(--tinta)':'#fff')+'">'+(o.inc?'?':o.v+'%')+'</text>';
    a0 = a1;
  });
  segs.forEach(function(o, i){
    const yy = cy - (segs.length - 1) * 13 + i * 26;
    s += '<rect x="228" y="'+(yy-9)+'" width="12" height="12" rx="3" fill="'+(o.inc?'var(--papel-2)':cols[i % cols.length])+'"'+(o.inc?' stroke="var(--tinta-4)" stroke-dasharray="3 2"':'')+'/>';
    s += '<text x="248" y="'+(yy+2)+'" class="gr-cat">'+esc(String(o.e))+' · '+(o.inc?'?':o.v+'%')+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(g.alt||'Gráfico circular')+'">'+s+'</svg>';
}

function figura(g){
  if(!g) return '';
  let svg = '';
  if(g.tipo === 'barras') svg = svgBarras(g);
  else if(g.tipo === 'linea') svg = svgLinea(g);
  else if(g.tipo === 'circular') svg = svgCircular(g);
  if(!svg) return '';
  return '<figure class="grafico">' + svg + (g.pie ? '<figcaption>'+esc(g.pie)+'</figcaption>' : '') + '</figure>';
}
function figuras(b){
  if(b.graficos && b.graficos.length) return '<div class="graficos">' + b.graficos.map(figura).join('') + '</div>';
  return figura(b.grafico);
}

    sello: Date.now()
  };
}
function guardar(){ return almacen.escribir(datosGuardado()); }

function progSeccion(i){
  const qs = SEC[i].bloques.filter(esPregunta);
  if(!qs.length) return {hechas:0, total:0, pct:0, ok:0};
  const hechas = qs.filter(q => respondida(q.id)).length;
  const ok = qs.filter(q => respondida(q.id) && est.reg[q.id].primera).length;
  return {hechas, total:qs.length, pct:Math.round(hechas/qs.length*100), ok};
}
function pintarAvance(){
  const hechas = PREG.filter(x => respondida(x.b.id)).length;
  avance.style.width = (PREG.length ? hechas/PREG.length*100 : 0) + '%';
}

// Repaso espaciado: preguntas falladas alguna vez, o acertadas sin
// seguridad, que ya cumplieron los días configurados.
function repasables(reg){
  reg = reg || est.reg;
  const dms = (GUIA.ajustes.diasRepaso || 3) * 86400000, ahora = Date.now();
  const listas = [], futuras = [];
  PREG.forEach(function(x){
    const r = reg[x.b.id];
    if(!r || !r.intentos) return;
    const firme = r.primera && r.dominada && r.confianza === 'seguro';
    if(firme) return;
    if(!r.cuando || ahora - r.cuando >= dms) listas.push(x.b.id);
    else futuras.push(x.b.id);
  });
  return {listas, futuras};
}

function videoDe(b, op){
  return (op && op.video) || (b && b.video) ||
         (op && op.trampa && (GUIA.ajustes.videosTrampa || {})[op.trampa]) || null;
}

// Orden barajado de opciones: estable dentro de la sesión para que la
// segunda oportunidad y el reintento no muevan las opciones de sitio.
function ordenDe(b){
  const ids = b.opciones.map(function(_, i){ return i; });
  if(GUIA.ajustes.barajarOpciones === false) return ids;
  if(!est.orden[b.id]) est.orden[b.id] = barajar(ids.slice());
  return est.orden[b.id];
}

function vistaPregunta(b){
  const modo = est.pantalla;                 // 'seccion' | 'repaso' | 'sim'
  const r = regDe(b.id);
  est.t0 = Date.now();

  // yaRegistrada = se responde de nuevo una pregunta que ya tiene registro
  // (pasa al volver con «Atrás»): esa no vuelve a bloquear la navegación.
  const yaRegistrada = modo === 'seccion' && respondida(b.id) && !est.respondida;
  // pendiente = pregunta sin responder que la guía exige responder:
  // mientras dure, no hay Índice ni Atrás por ningún lado.
  const pendiente = GUIA.ajustes.responderObligatorio !== false && !est.respondida && !yaRegistrada;
  // bloqueo = falta declarar la seguridad antes de poder responder
  const bloqueo = GUIA.ajustes.pedirConfianza && GUIA.ajustes.confianzaObligatoria !== false &&
                  !est.confianza && !est.respondida;

  if(modo === 'sim'){
    pintarCabeza('Modo simulacro', GUIA.meta.titulo, false,
      '<span class="crono" id="crono">--:--</span>');
  }else if(modo === 'repaso'){
    pintarCabeza('Ronda de repaso', 'Lo que quedó pendiente', !pendiente);
  }else{
    pintarCabeza(SEC[est.s].titulo, 'Sección '+(est.s+1)+' de '+SEC.length, !pendiente);
  }

  const etiqueta = modo === 'sim'
      ? 'SIMULACRO '+(est.simIdx+1)+' / '+est.simCola.length
    : modo === 'repaso'
      ? 'REPASO '+(est.j+1)+' / '+est.cola.length
      : 'PREGUNTA '+NUM[b.id]+' / '+PREG.length;

  const tabla = b.datos ? '<table class="datos">' +
      '<thead><tr>'+b.datos.encabezados.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead>' +
      '<tbody>'+b.datos.filas.map(f=>'<tr>'+f.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</tbody>' +
    '</table>' : '';

  let conf = '';
  if(GUIA.ajustes.pedirConfianza){
    if(!est.respondida){
      conf = '<div class="confianza">' +
        '<p'+(bloqueo?' class="exige"':'')+'>' +
          (bloqueo ? 'Antes de responder, elige tu nivel de seguridad. Sin eso las opciones siguen bloqueadas.'
                   : 'Antes de responder: ¿qué tan seguro estás?') +
        '</p>' + chipsConf(est.confianza, false) + '</div>';
    }else if(est.confianza){
      conf = '<div class="confianza">' +
        '<p class="marca-elegida">Respondiste sintiéndote:</p>' +
        chipsConf(est.confianza, true) + '</div>';
    }
  }

  let cuerpo;
  if(b.tipo === 'opcion'){
    const ord = ordenDe(b);
    cuerpo = '<ul class="opciones">' + ord.map(function(real, k){
      return '<li><button class="opcion" data-accion="responder" data-op="'+k+'"'+(bloqueo?' disabled':'')+'>' +
        '<span class="letra">'+LETRAS[k]+'</span><span>'+esc(b.opciones[real].texto)+'</span></button></li>';
    }).join('') + '</ul>';
  }else{
    const numerica = (b.respuestas||[]).every(x => /^[\d.,\s$%]+$/.test(String(x)));
    cuerpo = '<input class="campo" id="campo" type="text" autocomplete="off" enterkeyhint="done"' +
      ' inputmode="'+(numerica?'decimal':'text')+'"'+(bloqueo?' disabled':'') +
      ' value="'+esc(est.borrador||'')+'"' +
      ' placeholder="'+(bloqueo?'Elige tu seguridad para escribir':'Escribe tu respuesta')+'" aria-label="Tu respuesta">';
  }

  const pista = (modo !== 'sim' && GUIA.ajustes.permitirPista && b.pista && !est.respondida)
    ? (est.pista ? '<div class="pista">'+esc(b.pista)+'</div>'
                 : '<button class="enlace-pista" data-accion="pista">Ver una pista</button>') : '';

  lienzo.innerHTML = '<article class="tarjeta">' +
    '<div class="pregunta-cab">' +
      '<span class="numero">'+etiqueta+'</span>' +
      '<button class="icono" data-accion="marcar" aria-pressed="'+r.marcada+'" title="Marcar para revisar después">' +
        (r.marcada ? IC.estrella+'Marcada' : IC.estrellaO+'Marcar') + '</button>' +
    '</div>' +
    (b.tema ? '<div class="eyebrow">'+esc(b.tema)+'</div>' : '') +
    '<p class="enunciado">'+esc(b.enunciado)+'</p>' +
    figuras(b) + tabla + conf + cuerpo + pista +
    '<div id="retro" role="status" aria-live="polite"></div>' +
    '</article>';

  const notaBloqueo = bloqueo ? 'Paso 1 de 2<b>Elige tu seguridad</b>' : null;

  if(modo === 'sim'){
    tickSim();
    accion([
      {texto:'Terminar ahora', accion:'sim-terminar', clase:'btn btn--fantasma btn--chico'},
      b.tipo === 'abierta' ? {texto:'Comprobar', accion:'comprobar', clase:'btn', attr:(bloqueo?' disabled':'')} : null
    ], notaBloqueo || (b.tipo === 'opcion' ? 'Responde<b>para avanzar</b>' : null));
    return;
  }
  if(yaRegistrada){
    navegar('Continuar', null, 'Ya la respondiste<b>Repítela o sigue</b>');
  }else if(b.tipo === 'abierta' && !est.respondida){
    navegar(null, {texto:'Comprobar', accion:'comprobar', clase:'btn', attr:(bloqueo?' disabled':'')}, notaBloqueo);
  }else if(!est.respondida){
    navegar(null, null, notaBloqueo || 'Esta pregunta no se puede saltar<b>Elige una opción</b>');
  }else{
    navegar('Continuar');
  }
}

/* barra con retroceso + acción principal */
function navegar(textoSiguiente, botonPropio, nota){
  const enRepaso = est.pantalla === 'repaso';
  // si el bloque actual es una pregunta sin responder y la guía lo exige,
  // tampoco se puede retroceder para esquivarla
  const bl = (est.pantalla === 'seccion') ? SEC[est.s].bloques[est.b] : null;
  const pendiente = GUIA.ajustes.responderObligatorio !== false &&
                    bl && esPregunta(bl) && !est.respondida && !respondida(bl.id);
  const puedeAtras = !enRepaso && !pendiente && !(est.s === 0 && est.b === 0);
  const principal = botonPropio || (textoSiguiente
    ? {texto:textoSiguiente, accion:'siguiente', clase:'btn' + (puedeAtras ? '' : ' btn--ancho')}
    : null);
  accion([
    puedeAtras ? {texto:'Atrás', accion:'atras', clase:'btn btn--fantasma btn--chico'} : null,
    principal
  ], nota || null);
}

/* ── responder ────────────────────────────────────────────────── */
function bloqueActual(){
  if(est.pantalla === 'sim')    return porId[est.simCola[est.simIdx]].b;
  if(est.pantalla === 'repaso') return porId[est.cola[est.j]].b;
  return SEC[est.s].bloques[est.b];
}

function registrar(b, acerto, elegida, trampa){
  const r = regDe(b.id);
  const enRepaso = est.pantalla === 'repaso';
  r.intentos++;
  if(r.primera === null) r.primera = acerto;
  r.cuando = Date.now();
  if(acerto){
    r.dominada = true;
    if(enRepaso && est.confianza) r.confianza = est.confianza;   // el repaso puede afianzar
  }else if(enRepaso){
    r.dominada = false;                                          // fallar en repaso reabre la pregunta
  }
  if(r.confianza == null) r.confianza = est.confianza;
  if(!r.seg) r.seg = Math.round((Date.now() - (est.t0||Date.now()))/1000);
  if(r.elegida == null) r.elegida = elegida;
  if(trampa && r.trampa == null) r.trampa = trampa;
  est.reg[b.id] = r;
  guardar();
  pintarAvance();
}

function faltaConfianza(){
  return GUIA.ajustes.pedirConfianza && GUIA.ajustes.confianzaObligatoria !== false && !est.confianza;
}

function responderOpcion(k){
  if(est.respondida || faltaConfianza()) return;
  const b = bloqueActual();
  const ord = ordenDe(b);
  const real = ord[k];
  const op = b.opciones[real];
  const acerto = op.correcta === true;

  // — simulacro: una sola oportunidad, sin feedback, avance automático —
  if(est.pantalla === 'sim'){
    est.respondida = true;
    const botones = document.querySelectorAll('.opcion');
    botones.forEach(el => { el.disabled = true; });
    if(botones[k]) botones[k].dataset.estado = 'elegida';
    registrarSim(b, acerto, real, acerto ? null : (op.trampa || 'Error sin clasificar'));
    setTimeout(avanzarSim, 240);
    return;
  }

  est.intento++;

  // segunda oportunidad: primer fallo no revela
  if(!acerto && GUIA.ajustes.segundaOportunidad && est.intento === 1){
    const btn = document.querySelectorAll('.opcion')[k];
    if(btn){ btn.disabled = true; btn.dataset.estado = 'descartada'; }
    document.getElementById('retro').innerHTML =
      '<div class="respuesta" data-tipo="nudge">' +
        '<span class="titulo">Todavía no · te queda un intento</span>' +
        '<p>'+(b.pista ? esc(b.pista) : 'Vuelve a leer el enunciado y fíjate en qué te están preguntando exactamente.')+'</p>' +
      '</div>';
    return;
  }

  est.respondida = true;
  registrar(b, acerto, real, acerto ? null : (op.trampa || 'Error sin clasificar'));

  document.querySelectorAll('.opcion').forEach(function(el, i){
    el.disabled = true;
    if(i === k) el.dataset.estado = acerto ? 'acierto' : 'fallo';
    else if(b.opciones[ord[i]].correcta) el.dataset.estado = 'acierto';
  });

  const r = regDe(b.id);
  const vid = acerto ? null : videoDe(b, op);
  document.getElementById('retro').innerHTML =
    '<div class="respuesta" data-tipo="'+(acerto?'acierto':'fallo')+'">' +
      '<span class="titulo">'+esc(acerto ? 'Correcto' : (op.trampa || 'Esa era la trampa'))+'</span>' +
      '<p>'+(op.feedback || '')+'</p>' +
      (b.explicacion ? '<div class="porque">'+b.explicacion+'</div>' : '') +
      avisoConfianza(acerto, r) +
      (vid ? '<a class="video" href="'+esc(vid)+'" target="_blank" rel="noopener">Ver el video de esta trampa →</a>' : '') +
    '</div>';
  trasResponder();
  navegar('Continuar');
}

// Tras responder se recupera la navegación (Índice) y la escala de
// seguridad queda visible pero congelada, como registro de la decisión.
function trasResponder(){
  if(est.pantalla === 'seccion')
    pintarCabeza(SEC[est.s].titulo, 'Sección '+(est.s+1)+' de '+SEC.length, true);
  else if(est.pantalla === 'repaso')
    pintarCabeza('Ronda de repaso', 'Lo que quedó pendiente', true);
  document.querySelectorAll('.chip--conf').forEach(function(c){ c.disabled = true; });
}

function avisoConfianza(acerto, r){
  if(!GUIA.ajustes.pedirConfianza || !r.confianza) return '';
  if(!acerto && r.confianza === 'seguro')
    return '<div class="aviso-confianza"><strong>Esto es un punto ciego.</strong> Estabas seguro y fallaste: ese es el error más peligroso, porque no lo ibas a repasar. Márcalo.</div>';
  if(acerto && r.confianza === 'azar')
    return '<div class="aviso-confianza"><strong>Acertaste adivinando.</strong> Cuenta como correcta, pero no la des por sabida: vuelve a esta pregunta en unos días.</div>';
  if(!acerto && r.confianza === 'azar')
    return '<div class="aviso-confianza">Sabías que no sabías, y eso ya es útil: es un vacío que sí puedes cerrar estudiando.</div>';
  if(r.seg && r.seg < GUIA.ajustes.umbralApuro && !acerto)
    return '<div class="aviso-confianza">Respondiste en ' + r.seg + ' segundos. Si te tomas más tiempo en leer el enunciado, varios de estos errores desaparecen.</div>';
  return '';
}

function comprobarAbierta(){
  if(est.respondida || faltaConfianza()) return;
  const b = bloqueActual();
  const campo = document.getElementById('campo');
  const dado = campo ? campo.value : '';
  if(!dado.trim()) return;
  const acerto = b.respuestas.some(x => norm(x) === norm(dado));

  // — simulacro —
  if(est.pantalla === 'sim'){
    est.respondida = true;
    if(campo) campo.disabled = true;
    registrarSim(b, acerto, dado, acerto ? null : 'Respuesta abierta incorrecta');
    setTimeout(avanzarSim, 240);
    return;
  }

  est.intento++;
  if(!acerto && GUIA.ajustes.segundaOportunidad && est.intento === 1){
    document.getElementById('retro').innerHTML =
      '<div class="respuesta" data-tipo="nudge">' +
        '<span class="titulo">Todavía no · te queda un intento</span>' +
        '<p>'+(b.pista ? esc(b.pista) : 'Revisa el procedimiento paso a paso.')+'</p>' +
      '</div>';
    if(campo){ campo.value = ''; campo.focus(); }
    return;
  }

  est.respondida = true;
  registrar(b, acerto, dado, acerto ? null : 'Respuesta abierta incorrecta');
  if(campo) campo.disabled = true;
  const r = regDe(b.id);
  document.getElementById('retro').innerHTML =
    '<div class="respuesta" data-tipo="'+(acerto?'acierto':'fallo')+'">' +
      '<span class="titulo">'+(acerto ? 'Correcto' : 'Todavía no')+'</span>' +
      '<p>'+(acerto ? 'Esa es.' : 'La respuesta era <strong>'+esc(b.respuestas[0])+'</strong>.')+'</p>' +
      (b.explicacion ? '<div class="porque">'+b.explicacion+'</div>' : '') +
      avisoConfianza(acerto, r) +
    '</div>';
  trasResponder();
  navegar('Continuar');
}

/* ── navegación ───────────────────────────────────────────────── */
function guardarBorrador(){
  const c = document.getElementById('campo');
  est.borrador = (c && !c.disabled) ? c.value : est.borrador;
}
function limpiar(){
  est.respondida=false; est.pista=false; est.confianza=null; est.intento=0; est.borrador='';
}

function siguiente(){
  limpiar();
  if(est.pantalla === 'repaso'){
    est.j++;
    guardar();
    if(est.j >= est.cola.length) return vistaInforme();
    return vistaPregunta(bloqueActual());
  }
  est.b++;
  if(est.b >= SEC[est.s].bloques.length) return finSeccion();
  guardar();
  vistaBloque();
}

function atras(){
  limpiar();
  if(est.b > 0){ est.b--; }
  else if(est.s > 0){ est.s--; est.b = SEC[est.s].bloques.length - 1; }
  guardar();
  vistaBloque();
}

function finSeccion(){
  const p = progSeccion(est.s);
  const hayMas = est.s + 1 < SEC.length;
  const libre = hayMas && secVisible(est.s + 1);

    '<div class="eyebrow">Sección terminada</div>' +
    '<h2>'+esc(SEC[est.s].titulo)+'</h2>' +
    '<p>Acertaste <strong>'+p.ok+' de '+p.total+'</strong> al primer intento en esta sección.</p>' +
    (p.ok < p.total ? '<p>Lo que fallaste vuelve al final, en la ronda de repaso.</p>' : '<p>Sección limpia. Sigue.</p>') +
    '</article>' +
    (hayMas && !libre ? candadoHTML() : '');
  accion([
    {texto:'Índice', accion:'indice', clase:'btn btn--fantasma btn--chico'},

function iniciarSim(){
  est.simCola = barajar(pregVisibles().map(x => x.b.id));
  est.simIdx = 0;
  est.simReg = {};
  est.simIni = Date.now();
  est.simFin = Date.now() + simMin() * 60000;
  est.pantalla = 'sim';
  if(!est.tSesion) est.tSesion = Date.now();
  limpiar(); guardar();
  if(est.simTimer) clearInterval(est.simTimer);
  est.simTimer = setInterval(tickSim, 500);
  vistaPregunta(bloqueActual());
}

function tickSim(){
  if(est.pantalla !== 'sim') return;
  const resta = est.simFin - Date.now();
  if(resta <= 0){ finalizarSim('tiempo'); return; }
  const el = document.getElementById('crono');
  if(el){
    el.textContent = fmtCrono(resta);
    el.classList.toggle('crono--fin', resta < 60000);
  }
  avance.style.width = (est.simCola.length ? est.simIdx / est.simCola.length * 100 : 0) + '%';
}

function registrarSim(b, acerto, elegida, trampa){
  est.simReg[b.id] = {
    primera: acerto,
    confianza: est.confianza,
    seg: Math.round((Date.now() - (est.t0||Date.now()))/1000),
    elegida: elegida,
    trampa: acerto ? null : trampa
  };
  guardar();
}

function avanzarSim(){
  est.simIdx++;
  limpiar(); guardar();
  if(est.simIdx >= est.simCola.length) return finalizarSim('completo');
  vistaPregunta(bloqueActual());
}

function resumenSim(motivo){
  const reg = est.simReg;
  let resp = 0, ok = 0;
  const m = {ciego:0, dominio:0, fragil:0, vacio:0};
  const fallos = [];
  est.simCola.forEach(function(id){
    const r = reg[id];
    if(!r) return;
    resp++;
    if(r.primera) ok++; else fallos.push(id);
    if(r.confianza){
      const alto = r.confianza === 'seguro';
      if(r.primera && alto) m.dominio++;
      else if(!r.primera && alto) m.ciego++;
      else if(r.primera) m.fragil++;
      else m.vacio++;
    }
  });
  const usado = Math.min(simMin()*60, Math.max(1, Math.round((Date.now() - (est.simIni||Date.now()))/1000)));
  return {fecha:Date.now(), motivo, total:est.simCola.length, resp, ok,
          pct: resp ? Math.round(ok/resp*100) : 0, m, fallos, usado, reg};
}

function finalizarSim(motivo){
  if(est.simTimer){ clearInterval(est.simTimer); est.simTimer = null; }
  const res = resumenSim(motivo);
  est.sim = res;
  est.simCola = []; est.simIdx = 0; est.simReg = {}; est.simIni = null; est.simFin = null;
  limpiar(); guardar(); pintarAvance();
  vistaInformeSim(res);
}

/* ═══ ANÁLISIS ════════════════════════════════════════════════ */
function analizar(){
  const hechas = PREG.filter(x => respondida(x.b.id));
  const total = PREG.length;
  const ok = hechas.filter(x => est.reg[x.b.id].primera).length;
  const dom = hechas.filter(x => est.reg[x.b.id].dominada).length;

  const m = {ciego:0, dominio:0, fragil:0, vacio:0, sinDato:0};
  hechas.forEach(function(x){
    const r = est.reg[x.b.id];
    if(!r.confianza){ m.sinDato++; return; }
    const alto = r.confianza === 'seguro';
    if(r.primera && alto) m.dominio++;
    else if(!r.primera && alto) m.ciego++;
    else if(r.primera && !alto) m.fragil++;
    else m.vacio++;
  });

  const temas = {};
  hechas.forEach(function(x){
    const t = x.b.tema || 'General';
    temas[t] = temas[t] || {ok:0, n:0};
    temas[t].n++;
    if(est.reg[x.b.id].primera) temas[t].ok++;
  });

  const tr = {};
  hechas.forEach(function(x){
    const r = est.reg[x.b.id];
    if(!r.primera && r.trampa) tr[r.trampa] = (tr[r.trampa]||0) + 1;
  });
  const trampas = Object.keys(tr).map(k => ({nombre:k, n:tr[k]})).sort((a,b) => b.n - a.n);

  const apuradas = hechas.filter(x => est.reg[x.b.id].seg < GUIA.ajustes.umbralApuro && !est.reg[x.b.id].primera).length;
  const marcadas = PREG.filter(x => est.reg[x.b.id] && est.reg[x.b.id].marcada).length;
  const sinResponder = total - hechas.length;

  return {hechas:hechas.length, total, ok, dom, m, temas, trampas, apuradas, marcadas, sinResponder,
          pct: hechas.length ? Math.round(ok/hechas.length*100) : 0};
}

function recomendaciones(a){
  const R = [];
  if(a.m.ciego > 0)
    R.push('Tienes <strong>'+a.m.ciego+' '+(a.m.ciego===1?'punto ciego':'puntos ciegos')+'</strong>: preguntas donde estabas seguro y fallaste. Empieza por ahí, no por lo que ya sabes que no sabes.');
  if(a.trampas.length && a.trampas[0].n > 1)
    R.push('Repetiste <strong>'+a.trampas[0].n+' veces</strong> el mismo tipo de error: “'+esc(a.trampas[0].nombre)+'”. No son '+a.trampas[0].n+' fallas distintas, es una sola costumbre.');
  const flojos = Object.keys(a.temas).filter(t => a.temas[t].ok / a.temas[t].n < .5);
  if(flojos.length)
    R.push('Vuelve a estudiar la teoría de: <strong>'+flojos.map(esc).join(', ')+'</strong>. Ahí fallaste más de la mitad.');
  if(a.apuradas > 1)
    R.push('Fallaste '+a.apuradas+' preguntas respondiendo en menos de '+GUIA.ajustes.umbralApuro+' segundos. Leer el enunciado dos veces te habría subido el puntaje sin estudiar más.');
  if(a.m.fragil > 1)
    R.push('Acertaste '+a.m.fragil+' preguntas sin estar seguro. Cuentan, pero no están firmes: el repaso espaciado te las volverá a mostrar en '+(GUIA.ajustes.diasRepaso||3)+' días.');
  if(a.marcadas)
    R.push('Dejaste '+a.marcadas+' '+(a.marcadas===1?'pregunta marcada':'preguntas marcadas')+' para revisar. Está en el filtro de la revisión.');
  if(a.sinResponder > 0)
    R.push('Te faltan <strong>'+a.sinResponder+'</strong> preguntas por responder. El informe solo puede analizar lo que ya hiciste.');
  if(!R.length)
    R.push('Buen desempeño general. Repite la guía completa en tres días sin mirar las explicaciones: ahí sabrás si de verdad quedó.');
  return R;
}

function codigoExportar(){
  const vivo = Object.keys(est.reg).length || est.s || est.b;
  const d = vivo ? datosGuardado() : (almacen.leer() || datosGuardado());
  const j = JSON.stringify({t:GUIA.meta.titulo, v:GUIA.meta.version, d:d});
  return 'PC1.' + btoa(unescape(encodeURIComponent(j)));
}
function codigoImportar(txt){
  try{
    txt = String(txt||'').trim();
    if(txt.indexOf('PC1.') === 0) txt = txt.slice(4);
    const o = JSON.parse(decodeURIComponent(escape(atob(txt))));
    if(!o || !o.d) return {err:'El código no tiene el formato esperado.'};
    if(o.t !== GUIA.meta.titulo) return {err:'Ese código es de otra guía («'+o.t+'»).'};
    return {ok:o.d};
  }catch(e){
    return {err:'No se pudo leer el código. Revisa que lo copiaste completo, sin espacios de más.'};
  }
}

/* ═══ TARJETA DE RESULTADO (imagen canvas 1080×1350) ══════════ */
function slug(t){
  return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50) || 'resultado';
}
function notaAccion(txt){
  const n = document.getElementById('acciones-nota');
  if(!n) return;
  n.textContent = txt;
  setTimeout(function(){ if(n.isConnected && n.textContent === txt) n.textContent = ''; }, 4000);
}
function descargaBlob(blob, nombre){
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 900);
}
function rrect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function trk(ctx, txt, x, y, t){
  let cx = x;
  for(const ch of String(txt)){ ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + t; }
}
function envolver(ctx, txt, x, y, maxW, lh, maxL){
  const w = String(txt).split(' ');
  let linea = '', n = 0;
  for(let i = 0; i < w.length; i++){
    const t = linea ? linea+' '+w[i] : w[i];
    if(ctx.measureText(t).width > maxW && linea){
      ctx.fillText(linea, x, y); y += lh; linea = w[i]; n++;
      if(n >= maxL - 1){
        let resto = w.slice(i).join(' ');
        while(resto && ctx.measureText(resto+'…').width > maxW) resto = resto.slice(0, -1);
        ctx.fillText(resto ? resto+'…' : '…', x, y);
        return y + lh;
      }
    }else linea = t;
  }
  if(linea) ctx.fillText(linea, x, y);
  return y + lh;
}
function tarjetaImagen(){
  const a = analizar();
  const c = document.createElement('canvas');
  c.width = 1080; c.height = 1350;
  const x = c.getContext ? c.getContext('2d') : null;
  if(!x){ notaAccion('Este navegador no permite generar la imagen. Usa «Guardar como PDF».'); return; }

  const dibujar = function(){
    x.fillStyle = '#14161B'; x.fillRect(0, 0, 1080, 1350);
    x.strokeStyle = 'rgba(201,162,39,.55)'; x.lineWidth = 2;
    x.strokeRect(40, 40, 1000, 1270);

    x.fillStyle = '#C9A227'; x.font = '700 34px "Space Mono", monospace';
    trk(x, 'PUNTO CIEGO', 92, 148, 13);
    x.fillStyle = '#9AA0B4'; x.font = '400 27px Inter, sans-serif';
    x.fillText('Estudia lo que no sabes que no sabes.', 92, 196);

    x.fillStyle = '#F6F3EC'; x.font = '600 58px Fraunces, Georgia, serif';
    let ty = envolver(x, GUIA.meta.titulo, 92, 290, 900, 70, 3);
    if(GUIA.ajustes.comprador){
      x.fillStyle = '#C9A227'; x.font = '700 25px "Space Mono", monospace';
      trk(x, ('Informe de '+GUIA.ajustes.comprador).toUpperCase(), 92, ty, 5);
      ty += 48;
    }

    const yPct = Math.max(ty + 230, 800);
    x.fillStyle = '#F6F3EC'; x.font = '700 250px "Space Mono", monospace';
    x.fillText(a.pct + '%', 84, yPct);
    x.fillStyle = '#9AA0B4'; x.font = '400 30px Inter, sans-serif';
    x.fillText('de aciertos al primer intento · '+a.ok+' de '+a.hechas+' preguntas', 92, yPct + 54);

    const celdas = [
      [a.m.ciego,  'PUNTOS CIEGOS', '#E58A80'],
      [a.m.dominio,'DOMINIO',       '#7CC7A1'],
      [a.m.fragil, 'FRÁGILES',      '#E3C25C'],
      [a.m.vacio,  'VACÍOS',        '#9AA0B4']
    ];
    const cw = 210, ch = 200, gap = 20, x0 = (1080 - (cw*4 + gap*3)) / 2, y0 = 940;
    celdas.forEach(function(cd, i){
      const cx0 = x0 + i * (cw + gap);
      x.fillStyle = '#1B1E27'; rrect(x, cx0, y0, cw, ch, 14); x.fill();
      x.strokeStyle = '#3A404F'; x.lineWidth = 1.5; rrect(x, cx0, y0, cw, ch, 14); x.stroke();
      x.textAlign = 'center';
      x.fillStyle = cd[2]; x.font = '700 62px "Space Mono", monospace';
      x.fillText(String(cd[0]), cx0 + cw/2, y0 + 108);
      x.fillStyle = '#9AA0B4'; x.font = '700 17px "Space Mono", monospace';
      x.fillText(cd[1], cx0 + cw/2, y0 + 152);
      x.textAlign = 'left';
    });

    x.fillStyle = '#6B7385'; x.font = '400 22px Inter, sans-serif';
    x.fillText(new Date().toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'})+' · '+GUIA.meta.area, 92, 1252);
    x.fillStyle = '#565B6B'; x.font = '400 20px "Space Mono", monospace';
    x.fillText('guía interactiva · bymcyl', 92, 1288);

    const nombre = 'punto-ciego-' + slug(GUIA.meta.titulo) + '.png';
    if(c.toBlob){
      c.toBlob(function(blob){
        if(!blob){ notaAccion('No se pudo generar la imagen.'); return; }
        try{
          const f = new File([blob], nombre, {type:'image/png'});
          if(navigator.canShare && navigator.canShare({files:[f]}) && navigator.share){
            navigator.share({files:[f], title:'Mi resultado'}).catch(function(){ descargaBlob(blob, nombre); });
            notaAccion('Tarjeta lista ✓');
            return;
          }
        }catch(e){}
        descargaBlob(blob, nombre);
        notaAccion('Tarjeta descargada ✓');
      }, 'image/png');
    }else{
      notaAccion('No se pudo generar la imagen.');
    }
  };

  try{
    if(document.fonts && document.fonts.ready && document.fonts.ready.then){
      document.fonts.ready.then(dibujar, dibujar);
    }else dibujar();
  }catch(e){ dibujar(); }
}

function compartir(){

  const t = 'Hice la guía "'+GUIA.meta.titulo+'" de '+GUIA.meta.coleccion+': '+a.ok+'/'+a.hechas+' al primer intento' +
            (a.m.ciego ? ' y '+a.m.ciego+' puntos ciegos detectados.' : '.');

}

function empezar(reanudar){
  const g = reanudar ? almacen.leer() : null;
  if(g){
    est.s = g.s || 0; est.b = g.b || 0;
    est.reg = g.reg || {}; est.cola = g.cola || []; est.j = g.j || 0;
    est.seg = g.seg || 0; est.sim = g.sim || null;
    est.simCola = g.sCola || []; est.simIdx = g.sIdx || 0; est.simReg = g.sReg || {};
    est.simIni = g.sIni || null; est.simFin = g.sFin || null;
  }else{
    almacen.borrar();
    est.s = 0; est.b = 0; est.reg = {}; est.cola = []; est.j = 0; est.seg = 0;
    est.sim = null; est.simCola = []; est.simIdx = 0; est.simReg = {};
    est.simIni = null; est.simFin = null; est.orden = {};
  }
  est.tSesion = Date.now();
  limpiar(); pintarAvance();

  // si quedó un simulacro a medio camino, vuelve al reloj (o lo cierra si venció)
  if(g && est.simFin && est.simCola.length){
    if(Date.now() < est.simFin && est.simIdx < est.simCola.length){
      est.pantalla = 'sim';
      if(est.simTimer) clearInterval(est.simTimer);
      est.simTimer = setInterval(tickSim, 500);
      return vistaPregunta(bloqueActual());
    }
    return finalizarSim('tiempo');
  }
  // si quedó a mitad de la ronda de repaso, vuelve ahí y no al recorrido
  if(g && g.pantalla === 'repaso' && est.cola.length && est.j < est.cola.length){
    est.pantalla = 'repaso';
    return vistaPregunta(bloqueActual());
  }
  if(est.s >= SEC.length){ est.s = SEC.length - 1; est.b = 0; }
  if(est.b >= SEC[est.s].bloques.length) return finSeccion();
  vistaBloque();
}

/* ── delegación de eventos ────────────────────────────────────── */
document.addEventListener('click', function(ev){
  const el = ev.target.closest('[data-accion]');
  if(!el) return;
  const a = el.dataset.accion;

  if(a === 'empezar')   return empezar(false);
  if(a === 'reanudar')  return empezar(true);
  if(a === 'portada')   return vistaPortada();
  if(a === 'indice')    return vistaIndice();
  if(a === 'siguiente') return siguiente();
  if(a === 'atras')     return atras();
  if(a === 'responder') return responderOpcion(parseInt(el.dataset.op,10));
  if(a === 'comprobar') return comprobarAbierta();
  if(a === 'cerrar')    return cerrar();
  if(a === 'informe')   return vistaInforme();
  if(a === 'revision')  return vistaRevision();
  if(a === 'compartir') return compartir();
  if(a === 'tarjeta')   return tarjetaImagen();
  if(a === 'imprimir')  return window.print();
  if(a === 'transferir')return vistaTransferir();

  if(a === 'gancho'){
    if(est.gancho || !GUIA.gancho) return;
    const i = parseInt(el.dataset.g, 10);
    est.gancho = {i: i, ok: GUIA.gancho.opciones[i].correcta === true};
    return vistaPortada();
  }

  if(a === 'copiar-cod'){
    const t = document.getElementById('cod');
    if(!t) return;
    t.select();
    try{ t.setSelectionRange(0, 999999); }catch(e){}
    let copiado = false;
    try{ copiado = document.execCommand('copy'); }catch(e){}
    if(!copiado && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t.value).then(function(){}, function(){});
      copiado = true;
    }
    el.textContent = copiado ? 'Copiado ✓' : 'Selecciona y copia manualmente';
    setTimeout(function(){ if(el.isConnected) el.textContent = 'Copiar código'; }, 2500);
    return;
  }
  if(a === 'cargar-cod'){
    const t = document.getElementById('cod-in');
    const nota = document.getElementById('cod-nota');
    const r = codigoImportar(t ? t.value : '');
    if(r.err){ if(nota) nota.textContent = r.err; return; }
    almacen.escribir(r.ok);
    est.reg = {}; est.s = 0; est.b = 0; est.cola = []; est.j = 0; est.seg = 0;
    est.sim = null; est.simCola = []; est.simIdx = 0; est.simReg = {};
    est.simIni = null; est.simFin = null; est.tSesion = null; est.orden = {};
    limpiar(); pintarAvance();
    return vistaPortada();
  }

  if(a === 'ir-seccion'){
    const i = parseInt(el.dataset.s,10);
    if(!secVisible(i)){
      lienzo.innerHTML = candadoHTML();
      accion([{texto:'Volver al índice', accion:'indice', clase:'btn btn--fantasma btn--ancho'}]);
      return;
    }
    est.s = i; est.b = 0; est.pantalla = 'seccion'; limpiar(); guardar();
    return vistaBloque();
  }
  if(a === 'seccion-sig'){ est.s++; est.b = 0; est.pantalla='seccion'; limpiar(); guardar(); return vistaBloque(); }
  if(a === 'repaso-ini'){ est.pantalla='repaso'; return vistaPregunta(bloqueActual()); }

  if(a === 'repaso-esp'){
    if(!Object.keys(est.reg).length){
      const g = almacen.leer();
      if(g){
        est.s = g.s || 0; est.b = g.b || 0; est.reg = g.reg || {};
        est.seg = g.seg || 0; est.sim = g.sim || null;
      }
    }
    if(!est.tSesion) est.tSesion = Date.now();
    const rep = repasables();
    if(!rep.listas.length) return vistaIndice();
    est.cola = rep.listas; est.j = 0;
    return vistaIntroRepaso('Repaso espaciado',
      '<p>Vas a repetir <strong>'+rep.listas.length+'</strong> pregunta'+(rep.listas.length===1?'':'s')+' que acertaste sin seguridad o fallaste hace unos días.</p>' +
      '<p>Si hoy salen bien y marcas «Seguro», pasan a dominadas de verdad. Si vuelven a fallar, se reprograman.</p>');
  }

  if(a === 'sim-intro'){
    if(est.pantalla === 'sim') return;
    return vistaSimIntro();
  }
  if(a === 'sim-empezar') return iniciarSim();
  if(a === 'sim-terminar'){
    if(est.pantalla !== 'sim') return;
    try{ if(window.confirm && !window.confirm('¿Terminar el simulacro con lo respondido hasta ahora?')) return; }catch(e){}
    return finalizarSim('manual');
  }
  if(a === 'sim-detalle'){
    est.abierta = null;
    return vistaInformeSim(est.sim || est.simUlt);
  }
  if(a === 'sim-fallos'){
    if(!est.simUlt || !est.simUlt.fallos.length) return;
    est.cola = est.simUlt.fallos.slice(); est.j = 0;
    return vistaIntroRepaso('Fallos del simulacro',
      '<p>Vas a repetir con calma —y con explicación— lo que fallaste bajo presión. Lo que domines aquí sí cuenta en tu avance de práctica.</p>');
  }
  if(a === 'abrir-sim'){
    est.abierta = (est.abierta === 'sim:'+el.dataset.id) ? null : 'sim:'+el.dataset.id;
    return vistaInformeSim(est.simUlt);
  }

  if(a === 'pista'){ guardarBorrador(); est.pista = true; return vistaPregunta(bloqueActual()); }
  if(a === 'confianza'){
    if(est.respondida) return;                 // ya no se puede cambiar
    guardarBorrador();
    est.confianza = el.dataset.c;
    return vistaPregunta(bloqueActual());
  }
  if(a === 'marcar'){
    const b = bloqueActual(); const r = regDe(b.id);
    r.marcada = !r.marcada; est.reg[b.id] = r; guardar();
    el.setAttribute('aria-pressed', String(r.marcada));
    el.innerHTML = r.marcada ? IC.estrella+'Marcada' : IC.estrellaO+'Marcar';
    return;
  }
  if(a === 'filtro'){ est.filtro = el.dataset.f; est.abierta = null; return vistaRevision(); }
  if(a === 'abrir-rev'){ est.abierta = (est.abierta === el.dataset.id) ? null : el.dataset.id; return vistaRevision(); }
  if(a === 'reiniciar'){
    if(!est.confirmarBorrado){
      est.confirmarBorrado = true;
      el.textContent = 'Confirmar: borrar todo mi avance';
      el.classList.remove('btn--fantasma');
      setTimeout(function(){
        if(est.confirmarBorrado && el.isConnected){
          est.confirmarBorrado = false;
          el.textContent = 'Empezar de cero';
          el.classList.add('btn--fantasma');
        }
      }, 5000);
      return;
    }
    est.confirmarBorrado = false;
    almacen.borrar();
    est.reg = {}; est.s = 0; est.b = 0; est.j = 0; est.cola = []; est.seg = 0; est.tSesion = null;
    est.sim = null; est.simUlt = null; est.simCola = []; est.simIdx = 0; est.simReg = {};
    est.simIni = null; est.simFin = null; est.orden = {}; est.gancho = null;
    if(est.simTimer){ clearInterval(est.simTimer); est.simTimer = null; }
    limpiar(); pintarAvance(); return vistaPortada();
  }
});

document.addEventListener('keydown', function(ev){
  if(ev.key === 'Enter' && document.getElementById('campo') && !est.respondida){
    ev.preventDefault(); comprobarAbierta();
  }
});

// iOS Safari y Chrome Android pueden matar la pestaña sin avisar:
// guardamos también al ocultar o cerrar la página.
window.addEventListener('pagehide', function(){ if(est.tSesion) guardar(); });
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden' && est.tSesion){
    guardar();
    est.seg = segundosTotales();   // congela el cronómetro mientras no está a la vista
    est.tSesion = null;
  }else if(document.visibilityState === 'visible' && !est.tSesion && est.pantalla !== 'portada'){
    est.tSesion = Date.now();      // y lo reanuda al volver
  }
});

// gancho de depuración: abrir el archivo con #debug al final de la URL
try{
  if(window.location.hash.indexOf('debug') > -1){
    window.__pc = {est:est, guardar:guardar, analizar:analizar, iniciarSim:iniciarSim,
                   finalizarSim:finalizarSim, repasables:repasables, almacen:almacen};
  }
}catch(e){}

vistaPortada();

})();
</script>
</body>
</html>
